# ============================================================================
# /etc/wsl.conf  -  on EVERY node. Needs `wsl --shutdown` from Windows to apply.
# ============================================================================

[network]
# WSL regenerates /etc/hosts and /etc/resolv.conf at every boot by default,
# which throws away the static cluster block and any resolver you set. Turn both
# off and manage the files yourself.
generateHosts = false
generateResolvConf = false

[boot]
# WSL2 does not run systemd by default, so nothing restarts your daemons after a
# reboot. Enabling systemd lets you write real unit files for the Hadoop daemons
# instead of remembering to start them by hand.
systemd = true

[interop]
# Optional. Stops Windows PATH entries leaking into the Linux PATH, which can
# shadow `java` with a Windows java.exe and produce genuinely baffling errors.
appendWindowsPath = false
